<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Nav — 产品导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="header-logo">
        <span class="logo-icon" id="logo-icon">◆</span>
        <span id="logo-text">Product Nav</span>
      </a>
      <div class="header-actions">
        <a href="/admin/login.html" class="glass-btn glass-btn-sm">
          <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>管理</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <div class="hero-badge">
        <span>✦</span>
        <span id="hero-badge-text">精选产品导航</span>
      </div>
      <h1 id="hero-title">发现优秀的产品</h1>
      <p id="hero-subtitle">精心收录各类优质产品与工具，帮你快速找到所需</p>
      <a class="preheat-badge" href="https://github.com/Admin666pro/cloud-guidance-my" target="_blank" rel="noopener" aria-label="在 GitHub 上给这个项目点个 Star">
        <svg class="icon-svg star-icon" viewBox="0 0 24 24" width="16" height="16">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        <span class="preheat-name">Preheat</span>
        <span class="preheat-hint">GitHub 求 Star</span>
        <svg class="icon-svg" viewBox="0 0 24 24" width="14" height="14">
          <path d="M7 17 17 7"/><path d="M7 7h10v10"/>
        </svg>
      </a>
    </div>
  </section>

  <!-- Search Section -->
  <section class="search-section">
    <div class="container">
      <div class="search-bar">
        <span class="search-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="搜索产品..." autocomplete="off" />
      </div>
    </div>
  </section>

  <!-- Category Tabs -->
  <section class="category-tabs" id="category-tabs">
    <div class="container" style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;padding:0 1.5rem">
      <button class="category-tab active" data-category="all">全部</button>
    </div>
  </section>

  <!-- Products Grid -->
  <section class="products-section">
    <div class="container">
      <div class="products-grid" id="products-grid">
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <h3>加载中...</h3>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="footer-year">2025</span> <span id="footer-text">Product Nav. All rights reserved.</span></p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
