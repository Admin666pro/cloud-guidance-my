<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Nav — 产品导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <script>
    // 首帧前应用已保存的主题，避免暗色模式用户看到白屏闪烁
    try { if (localStorage.getItem('theme_pref') === 'dark') document.body.classList.add('dark-mode'); } catch (e) {}
  </script>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="header-logo">
        <span class="logo-icon" id="logo-icon">◆</span>
        <span id="logo-text">Product Nav</span>
      </a>
      <div class="header-actions">
        <button class="glass-btn glass-btn-sm theme-toggle" id="theme-toggle" aria-label="切换暗色模式" title="切换暗色模式">
          <svg class="icon-svg icon-sun" viewBox="0 0 24 24" width="16" height="16">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon-svg icon-moon" viewBox="0 0 24 24" width="16" height="16">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a href="https://github.com/Admin666pro/cloud-guidance-my" target="_blank" rel="noopener" class="glass-btn glass-btn-sm preheat-badge" id="preheat-badge" aria-label="在 GitHub 上给这个项目点个 Star">
          <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.24 3.34.95.1-.74.4-1.24.72-1.53-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18.92-.26 1.9-.39 2.88-.39s1.96.13 2.88.39c2.2-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.73.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.66.41.35.77 1.04.77 2.1 0 1.52-.01 2.74-.01 3.12 0 .3.2.66.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
          </svg>
          <span>Preheat</span>
          <span class="preheat-count" id="preheat-count">★ 0</span>
        </a>
        <a href="/admin/login.html" class="glass-btn glass-btn-sm">
          <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>管理</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <div class="hero-badge">
        <span>✦</span>
        <span id="hero-badge-text">精选产品导航</span>
      </div>
      <h1 id="hero-title">发现优秀的产品</h1>
      <p id="hero-subtitle">精心收录各类优质产品与工具，帮你快速找到所需</p>
    </div>
  </section>

  <!-- Search Section -->
  <section class="search-section">
    <div class="container">
      <div class="search-bar">
        <span class="search-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </span>
        <input type="text" id="search-input" placeholder="搜索产品..." autocomplete="off" />
      </div>
    </div>
  </section>

  <!-- Category Tabs -->
  <section class="category-tabs" id="category-tabs">
    <div class="container" style="display:flex;gap:0.5rem;flex-wrap:wrap;justify-content:center;padding:0 1.5rem">
      <button class="category-tab active" data-category="all">全部</button>
    </div>
  </section>

  <!-- Products Grid -->
  <section class="products-section">
    <div class="container">
      <div class="products-grid" id="products-grid">
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <h3>加载中...</h3>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="footer-year">2025</span> <span id="footer-text">Product Nav. All rights reserved.</span></p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
