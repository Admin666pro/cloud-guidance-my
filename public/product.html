<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品详情 — Product Nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <script>
    // 首帧前应用已保存的主题，避免暗色模式用户看到白屏闪烁
    try { if (localStorage.getItem('theme_pref') === 'dark') document.body.classList.add('dark-mode'); } catch (e) {}
  </script>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <a href="/" class="header-logo">
        <span class="logo-icon" id="logo-icon">◆</span>
        <span id="logo-text">Product Nav</span>
      </a>
      <div class="header-actions">
        <button class="glass-btn glass-btn-sm theme-toggle" id="theme-toggle" aria-label="切换暗色模式" title="切换暗色模式">
          <svg class="icon-svg icon-sun" viewBox="0 0 24 24" width="16" height="16">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon-svg icon-moon" viewBox="0 0 24 24" width="16" height="16">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a href="/" class="glass-btn glass-btn-sm">
          <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16">
            <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
          </svg>
          <span>返回首页</span>
        </a>
        <a href="/admin/login.html" class="glass-btn glass-btn-sm">
          <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <span>管理</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Product Detail -->
  <main class="product-detail-page" id="product-detail">
    <div class="container">
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <h3>加载中...</h3>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="footer-year">2025</span> <span id="footer-text">Product Nav. All rights reserved.</span> · v<span id="footer-version">1.1.0</span></p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
</body>
</html>
