<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 — Product Nav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <script>
    // 首帧前应用主题：用户手动选择 → 站点默认主题 → 跟随系统，避免白屏闪烁
    try {
      var pref = localStorage.getItem('theme_pref'), dark = pref === 'dark';
      if (!dark && pref !== 'light') {
        var cfg = null;
        try { cfg = JSON.parse(localStorage.getItem('site_config') || 'null'); } catch (e) {}
        var def = (cfg && cfg.default_theme) || 'system';
        if (def === 'dark') dark = true;
        else if (def !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) dark = true;
      }
      if (dark) document.body.classList.add('dark-mode');
    } catch (e) {}
  </script>
  <div class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="lock-icon">
          <svg class="icon-svg" viewBox="0 0 24 24" width="22" height="22" stroke="white">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>管理员登录</h1>
        <p>输入管理员密码以访问后台</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="password">管理员密码</label>
          <input
            type="password"
            id="password"
            name="password"
            class="glass-input"
            placeholder="请输入密码"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="form-actions">
          <button type="submit" class="glass-btn glass-btn-primary">登录</button>
        </div>
        <div class="login-error" id="login-error"></div>
      </form>

      <div style="text-align:center;margin-top:1.5rem;padding-top:1.5rem;border-top:0.5px solid rgba(0,0,0,0.06)">
        <a href="/" style="color:var(--text-tertiary);font-size:0.8125rem;text-decoration:none">
          ← 返回首页
        </a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
